# lazytam Hyprland defaults. Don't edit: override in ~/.config/hypr/hyprland.conf,
# which sources this file and then applies your settings on top.
source = ~/.config/lazytam/defaults/hypr/env.conf
source = ~/.config/lazytam/defaults/hypr/input.conf
source = ~/.config/lazytam/defaults/hypr/look.conf
source = ~/.config/lazytam/defaults/hypr/binds.conf
source = ~/.config/lazytam/defaults/hypr/rules.conf
source = ~/.config/lazytam/defaults/hypr/autostart.conf
