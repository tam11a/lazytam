# Layout and motion. Colors come from the theme (~/.config/lazytam/current/hyprland.conf).
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 12
    active_opacity = 1.0
    inactive_opacity = 0.95

    blur {
        enabled = true
        size = 6
        passes = 2
        vibrancy = 0.17
    }

    shadow {
        enabled = true
        range = 14
        render_power = 3
    }
}

animations {
    enabled = true
    bezier = smooth, 0.25, 1, 0.5, 1
    bezier = snappy, 0.2, 0.9, 0.1, 1.05
    animation = windows, 1, 4, snappy, popin 85%
    animation = windowsOut, 1, 3, smooth, popin 85%
    animation = border, 1, 8, smooth
    animation = fade, 1, 4, smooth
    animation = layers, 1, 3, smooth, fade
    animation = workspaces, 1, 4, smooth, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    focus_on_activate = true
}
