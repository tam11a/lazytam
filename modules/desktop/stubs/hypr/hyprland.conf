# Your Hyprland config (lazytam). Order matters:
#   1. apps from config.toml   2. lazytam defaults   3. theme colors   4. you
source = @HOME@/.config/lazytam/current/apps.conf
source = @HOME@/.config/lazytam/defaults/hypr/hyprland.conf
source = @HOME@/.config/lazytam/current/hyprland.conf

monitor = , preferred, auto, 1

# --- your overrides ---
# Anything here wins over the defaults above, e.g.:
# general {
#     gaps_out = 14
# }
# bind = $mod, N, exec, $termexec nvim
