# Your idle settings (starter file from lazytam; it's yours now, edit freely).
# On battery: dim at 2.5 min, lock at 5, screen off at 5.5. On the charger: none of these.
# No suspend: this box stays awake.
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# Brightness is always saved, so resume restores the right level even if you plug in while idle.
listener {
    timeout = 150
    on-timeout = brightnessctl -s set +0%; systemd-ac-power || brightnessctl set 10%
    on-resume = brightnessctl -r
}

listener {
    timeout = 300
    on-timeout = systemd-ac-power || loginctl lock-session
}

listener {
    timeout = 330
    on-timeout = systemd-ac-power || hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
